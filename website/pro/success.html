<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Decompute Pro — Activate</title>
<!--
  Stripe success page. Stripe redirects here with ?session_id={CHECKOUT_SESSION_ID}.
  It calls the gateway's /v1/billing/redeem-checkout, which verifies the session is PAID and
  carries the configured price before issuing a license key EXACTLY ONCE. The raw key is shown
  here a single time; nothing is stored client-side. The user activates it in the desktop app,
  which binds it to this Mac (the website never sees the device fingerprint).
-->
<style>
  :root { color-scheme: light dark; }
  body { font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; margin: 0;
         display: grid; place-items: center; min-height: 100vh; background: #0b0c0f; color: #e8eaed; }
  .card { width: min(480px, 92vw); background: #15171c; border: 1px solid #262a31; border-radius: 16px;
          padding: 32px; box-shadow: 0 20px 60px rgba(0,0,0,.4); }
  h1 { margin: 0 0 14px; font-size: 22px; }
  .key { display: flex; gap: 8px; }
  code { flex: 1; padding: 12px; border-radius: 10px; background: #0e1014; border: 1px solid #2c313a;
         font: 13px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace; word-break: break-all; }
  button { padding: 12px 14px; border: 0; border-radius: 10px; background: #6c8cff; color: #fff;
           font-weight: 600; cursor: pointer; white-space: nowrap; }
  .muted { color: #9aa0a6; }
  .steps { background: #0e1014; border: 1px solid #2c313a; border-radius: 10px; padding: 14px 16px; margin-top: 18px; }
  .err { color: #ff6b6b; min-height: 18px; }
  a.deeplink { display: inline-block; margin-top: 14px; color: #8fa6ff; }
</style>
</head>
<body>
  <div class="card" id="card">
    <h1 id="title">Activating your Pro license…</h1>
    <div class="err" id="err"></div>
    <div id="result" style="display:none">
      <p class="muted">Your Pro license key (copy it now — it's shown only once):</p>
      <div class="key"><code id="key"></code><button id="copy">Copy</button></div>
      <div class="steps">
        <strong>Activate on this Mac</strong>
        <p class="muted" style="margin:6px 0 0">Paste it into the app, or run in your terminal:</p>
        <code style="display:block;margin-top:8px" id="cmd"></code>
        <a class="deeplink" id="deeplink" href="#">Open in the Decompute app →</a>
      </div>
    </div>
  </div>
<script>
  const params = new URLSearchParams(location.search);
  const GATEWAY = (params.get("gw") || "http://127.0.0.1:8080").replace(/\/$/, "");
  const sessionId = params.get("session_id");
  const $ = (id) => document.getElementById(id);

  function fail(msg) { $("title").textContent = "Couldn't activate"; $("err").textContent = msg; }

  (async () => {
    if (!sessionId) return fail("Missing checkout session id.");
    try {
      const r = await fetch(GATEWAY + "/v1/billing/redeem-checkout", {
        method: "POST",
        headers: { "content-type": "application/json", "x-decompute-csrf": "web" },
        body: JSON.stringify({ session_id: sessionId }),
      });
      const data = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(data.detail || ("HTTP " + r.status));
      $("title").textContent = "You're Pro 🎉";
      if (data.license_key) {
        $("key").textContent = data.license_key;
        $("cmd").textContent = "decompute activate " + data.license_key;
        $("deeplink").href = "decompute://license/activate?key=" + encodeURIComponent(data.license_key);
        $("result").style.display = "block";
      } else {
        $("err").textContent = "This checkout was already redeemed. Open the app, or contact support for recovery.";
      }
    } catch (e) {
      fail(String(e.message || e));
    }
  })();

  $("copy").addEventListener("click", () => {
    navigator.clipboard.writeText($("key").textContent).then(() => { $("copy").textContent = "Copied"; });
  });
</script>
</body>
</html>
