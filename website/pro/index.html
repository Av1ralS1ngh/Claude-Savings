<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Decompute Pro</title>
<!--
  Hardened purchase page. It calls the Decompute gateway's /v1/billing/checkout and
  redirects to Stripe. It stores NOTHING (no Google Sheets, no raw keys, no device ids):
  the gateway is the only store and it keeps hashes only. The device is never handled here —
  the desktop app binds the license to the Mac after purchase (decompute activate <key>).

  Config: set GATEWAY to your gateway origin (override at runtime with ?gw=https://...).
  The gateway's DECOMPUTE_CORS_ORIGINS must include this page's origin.
-->
<style>
  :root { color-scheme: light dark; }
  body { font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; margin: 0;
         display: grid; place-items: center; min-height: 100vh; background: #0b0c0f; color: #e8eaed; }
  .card { width: min(440px, 92vw); background: #15171c; border: 1px solid #262a31; border-radius: 16px;
          padding: 32px; box-shadow: 0 20px 60px rgba(0,0,0,.4); }
  h1 { margin: 0 0 4px; font-size: 22px; }
  .sub { color: #9aa0a6; margin: 0 0 20px; }
  .price { font-size: 34px; font-weight: 700; }
  .price small { font-size: 14px; font-weight: 400; color: #9aa0a6; }
  ul { padding-left: 18px; color: #c7ccd1; }
  input { width: 100%; box-sizing: border-box; padding: 11px 12px; margin: 6px 0 14px; border-radius: 10px;
          border: 1px solid #2c313a; background: #0e1014; color: #e8eaed; font-size: 14px; }
  button { width: 100%; padding: 12px; border: 0; border-radius: 10px; background: #6c8cff; color: #fff;
           font-size: 15px; font-weight: 600; cursor: pointer; }
  button:disabled { opacity: .6; cursor: progress; }
  .err { color: #ff6b6b; margin-top: 10px; min-height: 18px; font-size: 13px; }
  .fine { color: #6b7077; font-size: 12px; margin-top: 16px; }
</style>
</head>
<body>
  <div class="card">
    <h1>Decompute Pro</h1>
    <p class="sub">Unlimited fair-use compression on this Mac.</p>
    <div class="price">$10 <small>/ month</small></div>
    <ul>
      <li>No daily compression limit</li>
      <li>Same Claude experience, fewer tokens</li>
      <li>Cancel anytime</li>
    </ul>
    <label for="email">Email (for your receipt &amp; license)</label>
    <input id="email" type="email" placeholder="you@example.com" autocomplete="email" />
    <button id="buy">Upgrade to Pro</button>
    <div class="err" id="err"></div>
    <p class="fine">After payment you'll get a license key. Activate it in the app:
       <code>decompute activate &lt;key&gt;</code>.</p>
  </div>
<script>
  const params = new URLSearchParams(location.search);
  const GATEWAY = (params.get("gw") || "http://127.0.0.1:8080").replace(/\/$/, "");
  const $ = (id) => document.getElementById(id);

  $("buy").addEventListener("click", async () => {
    const email = $("email").value.trim();
    $("err").textContent = "";
    $("buy").disabled = true;
    try {
      const r = await fetch(GATEWAY + "/v1/billing/checkout", {
        method: "POST",
        headers: { "content-type": "application/json", "x-decompute-csrf": "web" },
        body: JSON.stringify(email ? { email } : {}),
      });
      const data = await r.json().catch(() => ({}));
      if (!r.ok || !data.checkout_url) {
        throw new Error(data.detail || ("checkout failed (HTTP " + r.status + ")"));
      }
      location.href = data.checkout_url; // hand off to Stripe Checkout
    } catch (e) {
      $("err").textContent = String(e.message || e);
      $("buy").disabled = false;
    }
  });
</script>
</body>
</html>
