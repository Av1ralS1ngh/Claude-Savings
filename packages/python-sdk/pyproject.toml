[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "decompute-ai"
version = "0.1.0"
description = "Thin SDK + CLI for the Decompute Claude Optimization Gateway"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [{ name = "Decompute", email = "xcomp.decompute@gmail.com" }]
keywords = ["decompute", "claude", "anthropic", "llm", "gateway", "token-optimization", "cli"]
dependencies = ["httpx>=0.27", "typer>=0.12", "rich>=13.7"]

classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "License :: Other/Proprietary License",
  "Intended Audience :: Developers",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Environment :: Console",
]

[project.urls]
Homepage = "https://github.com/Decompute-AI"
Repository = "https://github.com/Decompute-AI/Claude-Coder"

[project.scripts]
decompute = "decompute_ai.cli:app"

[tool.setuptools.packages.find]
where = ["src"]
