[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "decompute-ai"
version = "0.1.0"
description = "Thin SDK for the Decompute Claude Optimization Gateway"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["httpx>=0.27", "typer>=0.12", "rich>=13.7"]

[project.scripts]
decompute = "decompute_ai.cli:app"

[tool.setuptools.packages.find]
where = ["src"]
