[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "decompute-ai"
version = "0.1.0"
description = "Thin SDK + CLI for the Decompute Claude Optimization Gateway"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }                       # TODO(confirm): final license before PyPI publish
authors = [{ name = "Decompute" }]                       # TODO(confirm): author name/email for PyPI
keywords = ["decompute", "claude", "anthropic", "llm", "gateway", "token-optimization", "cli"]
dependencies = ["httpx>=0.27", "typer>=0.12", "rich>=13.7"]

classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "License :: Other/Proprietary License",
  "Intended Audience :: Developers",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Environment :: Console",
]

[project.urls]                                            # TODO(confirm): real URLs before PyPI publish
Homepage = "https://decompute.ai"
Documentation = "https://decompute.ai/docs"

[project.scripts]
decompute = "decompute_ai.cli:app"

[tool.setuptools.packages.find]
where = ["src"]
