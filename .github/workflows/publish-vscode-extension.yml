name: Publish VS Code extension

# Publishes the Decompute extension to the VS Code Marketplace and Open VSX (for
# Cursor/VSCodium) when a tag like vscode-v0.1.0 is pushed, or on manual dispatch.
# Requires repo secrets: VSCE_PAT (Marketplace) and OVSX_PAT (Open VSX).
on:
  push:
    tags: ["vscode-v*"]
  workflow_dispatch:

defaults:
  run:
    working-directory: apps/vscode-extension

jobs:
  publish:
    runs-on: ubuntu-latest
    # Hoist secrets to JOB-level env so the step `if: env.* != ''` guards can read them.
    # A step's OWN `env:` is not visible to that step's `if:`, so the previous per-step env
    # made the publish guards evaluate against an empty value (publish never ran / failed).
    env:
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
      OVSX_PAT: ${{ secrets.OVSX_PAT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci || npm install
      - run: npm run typecheck
      - run: npm test          # gate release on the settings-safety suite (planWire/planUnwire data-loss guards)
      - run: npm run build:min
      - name: Package
        run: npx --yes @vscode/vsce@latest package --no-dependencies -o decompute.vsix
      - uses: actions/upload-artifact@v4
        with:
          name: decompute-vsix
          path: apps/vscode-extension/decompute.vsix
      - name: Publish to VS Code Marketplace
        if: env.VSCE_PAT != ''
        run: npx --yes @vscode/vsce@latest publish --no-dependencies --packagePath decompute.vsix
      - name: Publish to Open VSX
        if: env.OVSX_PAT != ''
        run: npx --yes ovsx publish decompute.vsix -p "$OVSX_PAT"
