name: release-cli

# Build the decompute-ai (CLI/SDK) + decompute-gateway wheels and publish them to the Cloudflare R2
# dist bucket that install.sh pulls from. The wheels are pure-Python (py3-none-any), so a single build
# serves every platform — the license boundary is the Ed25519 signature (see docs/offline_licensing.md),
# not obfuscation. (Optional Nuitka hardening of signed_license.py — scripts/build_engine_nuitka.sh — is
# a documented follow-up; it would make the gateway wheel platform-specific and need a build matrix.)
#
# Supersedes the old PyArmor->PyPI pipeline: distribution is R2 (install.sh), not PyPI, and the
# obfuscator is Nuitka, not PyArmor — so neither a PyArmor license nor a PyPI token is needed.
#
# Required repo secrets for the R2 publish job:
#   CLOUDFLARE_API_TOKEN   API token with R2 write on the `decompute-dist` bucket
#   CLOUDFLARE_ACCOUNT_ID  the Cloudflare account id
#
# Trigger: push a tag like v0.2.0 (build + publish), or run manually (build-only).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    name: build + verify wheels
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build wheels
        run: |
          python -m pip install --upgrade pip wheel
          mkdir -p dist/wheels
          pip wheel --no-deps packages/python-sdk -w dist/wheels
          pip wheel --no-deps apps/api          -w dist/wheels

      - name: Smoke-test the CLI wheel (clean venv)
        run: |
          python -m venv /tmp/v
          /tmp/v/bin/pip install dist/wheels/decompute_ai-*.whl
          /tmp/v/bin/decompute --help >/dev/null
          test -f /tmp/v/bin/decompute-mcp   # MCP entry point present
          echo "✓ CLI + decompute-mcp install and run"

      - name: Assert wheels match the tag version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          ver="${GITHUB_REF_NAME#v}"
          ls dist/wheels/decompute_ai-${ver}-py3-none-any.whl
          ls dist/wheels/decompute_gateway-${ver}-py3-none-any.whl
          grep -q "decompute_ai-${ver}-py3-none-any.whl" scripts/install.sh
          grep -q "decompute_gateway-${ver}-py3-none-any.whl" scripts/install.sh
          echo "✓ wheel versions == tag ${ver} == install.sh pins"

      - uses: actions/upload-artifact@v4
        with:
          name: wheels
          path: dist/wheels/decompute_*.whl
          if-no-files-found: error

  publish-r2:
    name: publish to R2
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    environment: r2          # add a manual-approval rule on this environment for a human gate
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: wheels
          path: dist/wheels

      # Skip-with-notice (not a hard fail) when the token is absent: a fresh repo won't have it yet,
      # and the release can still be published manually via scripts/sync_r2.sh. The notice + job
      # summary make a skipped publish loud, so it's never a silent "thought it shipped" footgun.
      - name: Check Cloudflare credentials
        id: cf
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CF_TOKEN" ]; then
            echo "has_token=false" >> "$GITHUB_OUTPUT"
            echo "::warning::CLOUDFLARE_API_TOKEN not set — SKIPPING R2 publish. Add the secret to automate, or run scripts/sync_r2.sh manually."
            echo "### ⚠️ R2 publish skipped — CLOUDFLARE_API_TOKEN not set (publish manually with scripts/sync_r2.sh)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "has_token=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish wheels + install.sh to R2
        if: steps.cf.outputs.has_token == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BUCKET: decompute-dist
        run: |
          set -euo pipefail   # any failed upload aborts the job (never report a partial publish as success)
          npm i -g wrangler
          # Wheels FIRST, install.sh LAST — install.sh must never point at a not-yet-uploaded wheel.
          for w in dist/wheels/decompute_*.whl; do
            echo "→ $(basename "$w")"
            wrangler r2 object put "$BUCKET/$(basename "$w")" --file "$w" --remote \
              || { echo "::error::failed to upload $(basename "$w") to R2"; exit 1; }
          done
          echo "→ install.sh"
          wrangler r2 object put "$BUCKET/install.sh" --file scripts/install.sh --remote \
            || { echo "::error::failed to upload install.sh to R2"; exit 1; }
          echo "✓ published $(ls dist/wheels/decompute_*.whl | wc -l) wheels + install.sh to r2://$BUCKET" >> "$GITHUB_STEP_SUMMARY"
